name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: tk-ghosh
          outputs: |
            snake.svg
            snake-dark.svg?palette=github-dark

      - name: Push snake to snake-output branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          mkdir -p deploy
          cp snake.svg deploy/
          cp snake-dark.svg deploy/

          cd deploy
          git init
          git add .
          git commit -m "Update snake animation [ci skip]"
          git branch -M snake-output
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push -f origin snake-output
