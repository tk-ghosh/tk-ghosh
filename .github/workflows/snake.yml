name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: tk-ghosh
          outputs: |
            dist/snake.svg?color_snake=#7c3aed
            dist/snake-dark.svg?color_snake=#a78bfa&palette=github-dark

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: snake-output
          user_name: tk-ghosh
          user_email: tutulkghosh@gmail.com
